name: Build Android app

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the APK
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Keep the APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: FunInstaller-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish it as the "latest" release (download this on the tablet)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk FunInstaller.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest FunInstaller.apk \
            --title "Fun Installer (latest build)" \
            --target "$GITHUB_SHA" \
            --latest \
            --notes "Built from commit ${GITHUB_SHA::7} on ${GITHUB_REF_NAME}. On your tablet, download FunInstaller.apk and open it to install or update."
