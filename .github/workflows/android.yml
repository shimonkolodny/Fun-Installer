name: Build Android app

# The Android app is a retired experiment (see docs/android-app.md), so this
# only runs when started by hand from the Actions tab.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the APK
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Keep the APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: FunInstaller-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
